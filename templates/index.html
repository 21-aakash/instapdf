<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InstaPDF - Instagram Carousel to PDF</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #090d16;
      --card-bg: #0f172a;
      --border: #1e293b;
      --accent-gradient: linear-gradient(135deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      --accent-glow: rgba(220, 39, 67, 0.25);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --radius: 16px;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(220, 39, 67, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(56, 189, 248, 0.05) 0px, transparent 50%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .container {
      width: 100%;
      max-width: 600px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2.25rem;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(12px);
    }

    .header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .logo-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: var(--accent-gradient);
      margin-bottom: 1rem;
      box-shadow: 0 8px 16px var(--accent-glow);
    }

    .logo-badge svg {
      width: 26px;
      height: 26px;
      fill: #fff;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.4rem;
    }

    .subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-dim);
      margin-bottom: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .input-wrapper {
      position: relative;
    }

    input[type="text"] {
      width: 100%;
      padding: 0.85rem 1rem;
      background: #090d16;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s;
      font-family: inherit;
    }

    input[type="text"]:focus {
      border-color: #e6683c;
      box-shadow: 0 0 0 3px rgba(230, 104, 60, 0.15);
    }

    input[type="text"]::placeholder {
      color: var(--text-dim);
    }

    .format-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .format-btn {
      padding: 0.85rem 1rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #090d16;
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.2s;
    }

    .format-btn.active {
      border-color: #e6683c;
      color: #fff;
      background: rgba(230, 104, 60, 0.1);
    }

    .btn-submit {
      width: 100%;
      padding: 0.95rem;
      border-radius: 10px;
      border: none;
      background: var(--accent-gradient);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      box-shadow: 0 6px 20px var(--accent-glow);
    }

    .btn-submit:hover:not(:disabled) {
      opacity: 0.95;
      transform: translateY(-1px);
    }

    .btn-submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .advanced-toggle {
      font-size: 0.8rem;
      color: var(--text-dim);
      background: none;
      border: none;
      cursor: pointer;
      display: block;
      margin: 1.2rem auto 0;
      text-decoration: underline;
    }

    .advanced-section {
      display: none;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px dashed var(--border);
    }

    .advanced-section.show {
      display: block;
    }

    /* Preview Gallery */
    .preview-section {
      display: none;
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
    }

    .preview-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.8rem;
    }

    .slide-badge {
      background: #1e293b;
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      font-size: 0.75rem;
      color: #38bdf8;
      font-weight: 600;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
      gap: 0.5rem;
      max-height: 200px;
      overflow-y: auto;
      padding: 0.5rem;
      background: #090d16;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .gallery-grid img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    .alert {
      display: none;
      padding: 0.85rem 1rem;
      border-radius: 10px;
      font-size: 0.85rem;
      margin-top: 1.25rem;
      line-height: 1.4;
    }

    .alert.error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.25);
      color: #fca5a5;
    }

    .alert.success {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.25);
      color: #6ee7b7;
    }

    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    footer {
      margin-top: 1.5rem;
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-dim);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="header">
        <div class="logo-badge">
          <svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
        </div>
        <h1>Instagram Carousel to PDF</h1>
        <p class="subtitle">Convert public carousels & slides into high-resolution PDFs instantly.</p>
      </div>

      <form id="dl-form">
        <div class="form-group">
          <label for="url">Instagram Post or Reel URL</label>
          <div class="input-wrapper">
            <input 
              type="text" 
              id="url" 
              placeholder="https://www.instagram.com/p/C6..." 
              required 
              autocomplete="off"
            />
          </div>
        </div>

        <div class="format-selector">
          <button type="button" class="format-btn active" data-format="pdf">
            <span>📄 Single PDF</span>
          </button>
          <button type="button" class="format-btn" data-format="zip">
            <span>📦 Images ZIP</span>
          </button>
        </div>

        <button type="submit" id="submit-btn" class="btn-submit">
          <span id="btn-text">Download Carousel</span>
          <div id="btn-spinner" class="spinner" style="display: none;"></div>
        </button>

        <button type="button" id="adv-toggle" class="advanced-toggle">Advanced Settings</button>
        
        <div id="adv-section" class="advanced-section">
          <div class="form-group">
            <label for="sessionid">Session ID Cookie (Optional, for rate-limited requests)</label>
            <input type="text" id="sessionid" placeholder="Paste sessionid cookie value" />
          </div>
        </div>
      </form>

      <!-- Preview Section -->
      <div id="preview-section" class="preview-section">
        <div class="preview-header">
          <span style="font-size: 0.85rem; font-weight: 600;">Detected Slides</span>
          <span id="slide-count-badge" class="slide-badge">0 slides</span>
        </div>
        <div id="gallery" class="gallery-grid"></div>
      </div>

      <div id="alert" class="alert"></div>
    </div>
    <footer>
      <span>FastAPI Async Engine • High-DPI Output</span>
    </footer>
  </div>

  <script>
    const form = document.getElementById('dl-form');
    const urlInput = document.getElementById('url');
    const sessionInput = document.getElementById('sessionid');
    const submitBtn = document.getElementById('submit-btn');
    const btnText = document.getElementById('btn-text');
    const btnSpinner = document.getElementById('btn-spinner');
    const alertBox = document.getElementById('alert');
    const advToggle = document.getElementById('adv-toggle');
    const advSection = document.getElementById('adv-section');
    const previewSection = document.getElementById('preview-section');
    const gallery = document.getElementById('gallery');
    const slideBadge = document.getElementById('slide-count-badge');
    const formatBtns = document.querySelectorAll('.format-btn');

    let selectedFormat = 'pdf';

    formatBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        formatBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedFormat = btn.dataset.format;
        btnText.textContent = selectedFormat === 'pdf' ? 'Download PDF' : 'Download ZIP';
      });
    });

    advToggle.addEventListener('click', () => {
      advSection.classList.toggle('show');
    });

    function showAlert(msg, isError = true) {
      alertBox.textContent = msg;
      alertBox.className = `alert ${isError ? 'error' : 'success'}`;
      alertBox.style.display = 'block';
    }

    function hideAlert() {
      alertBox.style.display = 'none';
    }

    // Auto-preview on paste
    urlInput.addEventListener('input', async () => {
      const url = urlInput.value.trim();
      if (!url.includes('instagram.com/')) return;

      try {
        const res = await fetch('/api/preview', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url, session_id: sessionInput.value.trim() })
        });
        const data = await res.json();
        if (data.success && data.slides.length > 0) {
          gallery.innerHTML = '';
          data.slides.forEach(s => {
            const img = document.createElement('img');
            img.src = s.url;
            gallery.appendChild(img);
          });
          slideBadge.textContent = `${data.slide_count} slides`;
          previewSection.style.display = 'block';
          hideAlert();
        }
      } catch (e) {
        // silent fail on preview
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();

      const url = urlInput.value.trim();
      if (!url) return;

      submitBtn.disabled = true;
      btnText.textContent = 'Generating...';
      btnSpinner.style.display = 'inline-block';

      try {
        const res = await fetch('/api/download', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            url: url,
            format: selectedFormat,
            session_id: sessionInput.value.trim()
          })
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => ({ detail: 'Download failed' }));
          throw new Error(errData.detail || 'Failed to download');
        }

        const blob = await res.blob();
        const disposition = res.headers.get('content-disposition') || '';
        let filename = selectedFormat === 'pdf' ? 'carousel.pdf' : 'slides.zip';
        const match = disposition.match(/filename="?([^"]+)"?/);
        if (match) filename = match[1];

        const downloadUrl = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = downloadUrl;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        window.URL.revokeObjectURL(downloadUrl);

        showAlert(`Successfully downloaded ${filename}!`, false);
      } catch (err) {
        showAlert(err.message || 'An error occurred while fetching the post.');
      } finally {
        submitBtn.disabled = false;
        btnText.textContent = selectedFormat === 'pdf' ? 'Download PDF' : 'Download ZIP';
        btnSpinner.style.display = 'none';
      }
    });
  </script>
</body>
</html>
